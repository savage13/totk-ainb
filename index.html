<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
<body>
  <div id="styleshow">
    <div style="font-size: 26px; text-align:center;">&#9881;</div>
    <div id="style">
      Layout
      <select id="ranker">
        <option>network-simplex</option>
        <option>tight-tree</option>
        <option>longest-path</option>
      </select>
      Direction
      <select id="rankdir">
        <option value="TB">top-bottom</option>
        <option value="BT">bottom-top</option>
        <option value="LR">left-right</option>
        <option value="RL">right-left</option>
      </select>
      Align
      <select id="align">
        <option value="UL">up-left</option>
        <option value="UR">up-right</option>
        <option value="DL">down-left</option>
        <option value="DR">down-right</option>
      </select>
      Rank Separation
      <input type="range" min="0" max="1000" id="ranksep" step="10" value="50">
      Node Separation
      <input type="range" min="0" max="1000" id="nodesep" step="10" value="50">
    </div>
  </div>
  <div id="title" title="click to remove">
    <div class="title">TotK ainb viewer</div>
    <div class="info"><a href="https://github.com/dt-12345/ainb">conversion and data format work</a>
      from <a href="https://github.com/dt-12345">dt-12345</a></div>
  </div>
  <div class="split">
    <div id="side" class="vsplit">
      <div id="nodelist0">
        <div class="part">Nodes <a id="raw" target=_blank href="nothing.json">raw ainb</a></div>
        <input type="text" id="node_search" placeholder="search ..." class="search">
        <div id="nodelist">
        </div>
      </div>
      <div id="ainbfiles">
        <div class="part">ainb Files</div>
        <input type="text" id="ainb_search" placeholder="search ..." class="search">
        <div id="ainblist"></div>
      </div>
    </div>
    <div id="graph">
      <svg><g/></svg>
    </div>
  </div>
</body>
<script src="main.js" type="module"></script>
</html>
